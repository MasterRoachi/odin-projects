<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Quartz, Parchment, Shears — Rock Paper Scissors, played in the park. First to five."
    />
    <title>Quartz, Parchment, Shears</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!--
      The scene: a CSS sky with an original inline-SVG landscape anchored to
      the bottom. Drawn rather than photographed, so it scales to any window,
      stays sharp, and adds nothing to the page weight.
    -->
    <div class="sky" aria-hidden="true">
      <span class="cloud cloud-1"></span>
      <span class="cloud cloud-2"></span>

      <svg
        class="scenery"
        viewBox="0 0 1600 620"
        preserveAspectRatio="xMidYMax slice"
        role="presentation"
        focusable="false"
      >

        <!-- far ridge -->
        <path
          class="sc-far"
          d="M0,620 L0,438 Q210,336 434,402 Q648,466 862,392 Q1092,314 1312,392 Q1468,444 1600,406 L1600,620 Z"
        />

        <!-- back treeline: one scalloped silhouette, so no seams show -->
        <path
          class="sc-trees-back"
          d="M0,620 L0,440
             a60,60 0 0 1 120,0 a80,80 0 0 1 160,0 a50,50 0 0 1 100,0
             a90,90 0 0 1 180,0 a65,65 0 0 1 130,0 a55,55 0 0 1 110,0
             a85,85 0 0 1 170,0 a52.5,52.5 0 0 1 105,0 a72.5,72.5 0 0 1 145,0
             a62.5,62.5 0 0 1 125,0 a95,95 0 0 1 190,0 a32.5,32.5 0 0 1 65,0
             L1600,620 Z"
        />

        <!-- power line running behind the near trees -->
        <g class="sc-wires">
          <path d="M300,366 Q726,474 1152,366" />
          <path d="M300,392 Q726,496 1152,392" />
        </g>
        <g class="sc-poles">
          <rect x="291" y="330" width="18" height="290" rx="4" />
          <rect x="252" y="356" width="96" height="15" rx="5" />
          <rect x="1143" y="330" width="18" height="290" rx="4" />
          <rect x="1104" y="356" width="96" height="15" rx="5" />
        </g>

        <!-- near treeline -->
        <path
          class="sc-trees"
          d="M0,620 L0,502
             a75,75 0 0 1 150,0 a95,95 0 0 1 190,0 a65,65 0 0 1 130,0
             a105,105 0 0 1 210,0 a80,80 0 0 1 160,0 a70,70 0 0 1 140,0
             a100,100 0 0 1 200,0 a67.5,67.5 0 0 1 135,0 a87.5,87.5 0 0 1 175,0
             a55,55 0 0 1 110,0
             L1600,620 Z"
        />

        <!-- the near bank the objects float over -->
        <path
          class="sc-grass"
          d="M0,620 L0,556 Q300,512 646,548 Q986,582 1292,534 Q1452,510 1600,526 L1600,620 Z"
        />
        <g class="sc-tufts">
          <path d="M120,576 l10,-22 l10,22" />
          <path d="M420,566 l10,-22 l10,22" />
          <path d="M905,580 l10,-22 l10,22" />
          <path d="M1210,556 l10,-22 l10,22" />
          <path d="M1490,548 l10,-22 l10,22" />
        </g>
      </svg>
    </div>

    <div class="page">
      <header class="masthead">
        <img
          class="masthead-art"
          src="./images/heading.png"
          alt="Quartz, Parchment, Shears — choose wisely"
          width="727"
          height="458"
        />
      </header>

      <main class="game">
        <!-- ========== SCOREBOARD ========== -->
        <section class="scoreboard" aria-label="Score">
          <div class="sign">
            <p class="sign-name">You</p>
            <p class="sign-score" id="human-score">0</p>
            <ol class="pips" id="human-pips" aria-hidden="true">
              <li></li><li></li><li></li><li></li><li></li>
            </ol>
          </div>

          <p class="target">First<br /><span>to 5</span></p>

          <div class="sign">
            <p class="sign-name">Adversary</p>
            <p class="sign-score" id="computer-score">0</p>
            <ol class="pips" id="computer-pips" aria-hidden="true">
              <li></li><li></li><li></li><li></li><li></li>
            </ol>
          </div>
        </section>

        <!-- ========== ARENA ========== -->
        <section class="arena" aria-label="This round">
          <figure class="slot">
            <div class="stage" id="slot-human">
              <span class="shadow" aria-hidden="true"></span>
            </div>
            <figcaption>Your play</figcaption>
          </figure>

          <div class="verdict">
            <p class="verdict-line" id="verdict" role="status" aria-live="polite">
              Choose wisely.
            </p>
            <p class="round-no" id="round-no">Round 1</p>
          </div>

          <figure class="slot">
            <div class="stage" id="slot-computer">
              <span class="shadow" aria-hidden="true"></span>
            </div>
            <figcaption>Their play</figcaption>
          </figure>
        </section>

        <!-- ========== CHOICES ========== -->
        <section class="choices" aria-label="Make your play">
          <button class="choice choice-quartz" data-choice="quartz" type="button">
            <span class="choice-float">
              <img src="./images/cutouts/quartz.png" alt="" width="433" height="554" />
              <span class="shadow" aria-hidden="true"></span>
            </span>
            <span class="choice-name">Quartz <kbd>Q</kbd></span>
          </button>

          <button class="choice choice-parchment" data-choice="parchment" type="button">
            <span class="choice-float">
              <img src="./images/cutouts/parchment.png" alt="" width="567" height="577" />
              <span class="shadow" aria-hidden="true"></span>
            </span>
            <span class="choice-name">Parchment <kbd>P</kbd></span>
          </button>

          <button class="choice choice-shears" data-choice="shears" type="button">
            <span class="choice-float">
              <img src="./images/cutouts/shears.png" alt="" width="514" height="583" />
              <span class="shadow" aria-hidden="true"></span>
            </span>
            <span class="choice-name">Shears <kbd>S</kbd></span>
          </button>
        </section>

      </main>

      <!-- ========== LEDGER ========== -->
      <section class="ledger" aria-label="Round history">
        <div class="ledger-head">
          <h2>The Ledger</h2>
          <div class="ledger-actions">
            <button
              class="chip"
              id="sound"
              type="button"
              aria-pressed="true"
              title="Toggle sound"
            >
              <span aria-hidden="true">♪</span> Sound: on
            </button>
            <button class="chip" id="reset" type="button">New game</button>
          </div>
        </div>

        <ol class="ledger-list" id="ledger">
          <li class="ledger-empty">No rounds played yet.</li>
        </ol>
      </section>


      <footer class="colophon">
        <p>
          Quartz blunts shears &middot; Shears cut parchment &middot; Parchment
          wraps quartz
        </p>
        <p class="colophon-credit">
          Illustrations by Master Roachi. Built for
          <a href="https://www.theodinproject.com/">The Odin Project</a>
          Foundations.
        </p>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
