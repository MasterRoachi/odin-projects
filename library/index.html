<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
        <h1>Library</h1>
        <button id="new-book" type="button">Add Book</button>
        <section id="bookshelf"></section>
        <dialog id="dialog">
          <form id="form" method="post">
            <fieldset>
              <label for="title">Title:</label>
              <input type="text" id="title" name="title" required>
              <label for="author">Author:</label>
              <input type="text" id="author" name="author" required>
              <label for="genre">Genre:</label>
              <input type="text" id="genre" name="genre" required>
              <label for="description">Describe the book briefly:</label>
              <input type="text" id="description" name="description">
            </fieldset>
            <fieldset>
              <label for="pages">How many pages does the book have?</label>
              <input type="number" id="pages" name="pages">
              <label for="read">I've read this!:</label>
              <input type="radio" id="read" name="read">
              <label for="cover">Cover:</label>
              <input type="file" id="cover" name="cover">
              </fieldset>
              <button type="submit" id="submit-book"> Add to Library</button>
          </form>
        </dialog>
    </main>
  </body>
</html>
