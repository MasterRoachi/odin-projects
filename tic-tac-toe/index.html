<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section class="header">
      <h1>Tic-Tac-Toe</h1>
      <div class="buttons">
      <button class="headbtn" id="swap">Swap Tokens</button>
      <button class="headbtn" id="new">New Players</button>
      </div>
    </section>
    <main>
      <p class="active-player"></p>
      <div class="gameboard"></div>
      <dialog class="player-setup">
        <h2 class="question">What are your names?</h2>
        <form class="player-form">
          <input type="text" id="player-one" placeholder="Player One (X)" required />
          <input type="text" id="player-two" placeholder="Player Two (O)" required />
          <button class="dialog-button" type="submit">Start Game</button>
        </form>
      </dialog>
      <dialog class="winner-box">
        <h2 class="yay">Yay!!</h2>
        <p class="winner"></p>
        <button class="dialog-button" id="play-again">Play Again</button>
      </dialog>
    </main>
  </body>
</html>
